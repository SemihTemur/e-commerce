spring:
  application:
    name: inventory-service
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI}

  kafka:
    bootstrap-servers:
      - localhost:29092
      - localhost:39092
      - localhost:49092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3
        enable.idempotence: true

    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.semih.*"
        spring.json.use.type.headers: true

    listener:
      ack-mode: record

    # HATA BURADAYDI: listener'ın içine girmişti, şimdi dışarı çıkardım (kafka'nın altında)
    properties:
      topics:
        product-events: product-events-topic
        product-stock-response-events: product-stock-response-events
        order-events: order-events-topic
        inventory-response: inventory-response-topic

server:
  port: 8084

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans